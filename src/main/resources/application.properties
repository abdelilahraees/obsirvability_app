spring.application.name=observability_app
server.port=8079
spring.jpa.hibernate.ddl-auto=update

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always

# ===== OTLP export vers LGTM (Grafana + Tempo + Mimir + Loki) =====
# Traces -> Tempo
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

# Metrics -> Mimir (Prometheus)
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
# Requis pour le dashboard "RED Metrics (classic histogram)" de otel-lgtm
management.otlp.metrics.export.histogram-flavor=explicit_bucket_histogram
management.otlp.metrics.export.base-time-unit=seconds

# Logs -> Loki
management.otlp.logging.endpoint=http://localhost:4318/v1/logs
management.logging.export.otlp.enabled=true

# Corrélation logs <-> traces (trace_id / span_id dans les MDC)
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# Attributs de ressource
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.instance.id=${spring.application.name}:${server.port}
management.opentelemetry.resource-attributes.deployment.environment=dev
